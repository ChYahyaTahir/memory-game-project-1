<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memory Match - Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Background decoration -->
  <div class="bg-circle circle-1"></div>
  <div class="bg-circle circle-2"></div>

  <!-- Navigation bar -->
  <nav class="navbar">
    <a href="index.html" class="logo">🃏 Memory<span>Match</span></a>
    <button class="menu-btn" id="menu-btn">☰</button>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="easy.html" class="easy">Easy</a></li>
      <li><a href="medium.html" class="medium">Medium</a></li>
      <li><a href="hard.html" class="hard">Hard</a></li>
      <li><a href="services.html">Services</a></li>
      <li><a href="portfolio.html">Portfolio</a></li>
      <li><a href="contact.html">Contact</a></li>
      <li><a href="login.html" class="login-link active">Login</a></li>
    </ul>
  </nav>

  <!-- Login form (design only, it does not really log in) -->
  <section class="login-page">
    <div class="login-box">
      <a href="index.html" class="logo">🃏 Memory<span>Match</span></a>
      <h1>Welcome Back! 👋</h1>
      <p>Log in to keep training your memory.</p>

      <form action="#">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" placeholder="you@example.com">
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Enter your password">
        </div>

        <div class="form-options">
          <label><input type="checkbox"> Remember me</label>
          <a href="#">Forgot Password?</a>
        </div>

        <button type="submit" class="btn btn-primary">Log In</button>
      </form>

      <p class="signup-text">Don't have an account? <a href="#">Sign Up</a></p>
    </div>
  </section>

  <footer>
    <p>© 2026 Memory Match · Made with HTML, CSS &amp; JavaScript</p>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
